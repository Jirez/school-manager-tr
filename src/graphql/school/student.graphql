fragment studentFields on Student {
    id
    lastName
    firstName
    displayName
    gender
    birthDate
    birthplace
    presumeBirthDate
    registrationNumber
    active
    note
    inscriptionMode
    knownHealthProblem
    rhesus
    religion
    ethnicGroup
    bloodGroup
    otherUsefulInfo
    origin {
        countryOrigin
        districtOrigin
        departmentOrigin
        regionOrigin
    }
    address {
        street
        state
        country
        town
        zipCode
    }
    contactInfo {
        telephone
        email
        postOfficeBox
        mobile
        fax
    }
    createdDate
}

query Students($id: Int!) {
    students: findStudent(id: $id) {
        ...studentFields
    }
}

query UnregisteredStudents($id: Int!) {
    students: unregisteredStudent(id: $id) {
        ...studentFields
    }
}

query StudentsById($id: Long!) {
    student: findStudentById(id: $id) {
        ...studentFields
    }
}

query StudentsByClass($id: Int!) {
    students: findStudentByClass(id: $id) {
        ...studentFields
    }
}

mutation StudentSave($student: StudentCreateInput!) {
    student: storeStudent(student: $student) {
        ...studentFields
    }
}

mutation StudentUpdate($student: StudentUpdateInput!) {
    student: updateStudent(student: $student) {
        ...studentFields
    }
}

mutation StudentDelete($id: Long!) {
    deleteStudentById(id: $id)
}

mutation StudentsDelete($ids: [Long!]!) {
    studentDeleteByIds(ids: $ids)
}

subscription StudentCreated {
    student: onStudentCreated {
        ...studentFields
    }
}

query NewRegistrationNumber($id: Int!) {
    newRegistrationNumber(id: $id)
}

fragment frequentFields on Frequent {
    id
    frequentPK {
        id
        studentId
        schoolYearId
        classId
    }
    numberOrder
    repeater
    formerStudent
    external
    apt
    smsTo
    mailTo
    socialCase
    scNature
    scObservation
    student {
        id
        lastName
        firstName
        gender
        birthDate
        birthplace
        registrationNumber
    }
    clazz {
        id
        name
        code
    }
    oldSchool {
        id
        name
    }
    paymentGroup {
        id
        name
    }
    feeGroup {
        id
        name
    }
    totalRequiredAmount
    totalPaidAmount
    lastPaymentDate
}

fragment frequentUnionFields on FrequentUnion {
    id
    frequentPK {
        id
        studentId
        schoolYearId
        classId
    }
    className
    repeater
    fullName
    birthDate
    birthplace
    registrationNumber
    sex
    socialCase
    totalRequiredAmount
    totalPaidAmount
    lastPaymentDate
}

query Frequents($id: Int!) {
    frequents: findFrequent(id: $id) {
        ...frequentFields
    }
}

query FrequentBySchool($id: Int!) {
    frequents(schoolId: $id) {
        ...frequentUnionFields
    }
}

