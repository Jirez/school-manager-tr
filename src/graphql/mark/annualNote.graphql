query AnnualNotes($classId: Int!, $subjectId: Int!, $schoolId: Int!) {
  annualNotes: findAnnualNote(
    classId: $classId
    subjectId: $subjectId
    schoolId: $schoolId
  ) {
    note1
    note2
    note3
    note4
    note5
    note6
    studentFullName
    student {
      id
      registrationNumber
      lastName
      firstName
    }
  }
}

mutation AnnualNoteSave(
  $notes: [AnnualNote!]!
  $classId: Int!
  $subjectId: Int!
  $schoolId: Int!
) {
  storeAnnualNote(
    notes: $notes
    classId: $classId
    subjectId: $subjectId
    schoolId: $schoolId
  )
}

mutation AnnualCompNoteCalculation($classId: Int!, $schoolYearId: Int!) {
  calculateAnnualCompNote(classId: $classId, schoolYearId: $schoolYearId)
}

mutation AnnualCompNotesCalculation($schoolYearId: Int!, $schoolId: Int!) {
  calculateAllAnnualCompNote(schoolYearId: $schoolYearId, schoolId: $schoolId)
}
