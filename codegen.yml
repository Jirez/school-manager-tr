overwrite: true
schema: 'http://localhost:8080/graphql'
documents: 'src/graphql/**/*.graphql'
emitLegacyCommonJSImports: true
generates:
  './src/gql/graphql.ts':
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      addDocBlocks: false
      reactApolloVersion: 3
